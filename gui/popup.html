<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>鱼鱼谷托管</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="dot" id="dot"></span>
      <h1>鱼鱼谷托管</h1>
      <span class="ver" id="ver"></span>
    </div>
    <div class="top-right">
      <span class="pill" id="linkState">未连接</span>
      <label class="switch" title="托管总开关">
        <input type="checkbox" id="enabled" /><span></span>
      </label>
    </div>
  </header>

  <div class="conn launch-box" id="connBox" hidden>
    <p><b>主程序没有运行。</b>点下面的按钮直接拉起（无需开机自启，也不用敲命令）：</p>
    <div class="row">
      <button id="btnLaunch">启动主程序</button>
      <button id="reconnect" class="ghost">已启动，重新连接</button>
    </div>
    <p class="muted" id="launchHint" style="margin-top:8px"></p>
    <code>如果按钮无效：在项目目录执行 node yuyugu2.mjs</code>
    <div class="row" style="margin-top:8px">
      <label>端口 <input type="number" id="port" value="8787" min="1" max="65535" /></label>
    </div>
  </div>

  <nav class="tabs">
    <button data-tab="overview" class="on">概览</button>
    <button data-tab="market">市场预测</button>
    <button data-tab="settings">设置</button>
    <button data-tab="logs">日志</button>
  </nav>

  <!-- 概览 -->
  <section id="tab-overview" class="tab">
    <div class="grid2">
      <div class="card big">
        <small>今日净增（D币 + 库存）</small>
        <b id="dayNet">—</b>
        <div class="sub" id="dayNetSub"></div>
      </div>
      <div class="card">
        <small>D币</small>
        <b id="coins">—</b>
        <div class="sub" id="stock">—</div>
      </div>
    </div>
    <div class="card">
      <div class="card-row"><span>岛上时间</span><b id="isleTime">—</b></div>
      <div class="card-row"><span>体力</span><b id="energy">—</b></div>
      <div class="card-row"><span>地块 / 畜栏 / 蟹笼</span><b id="scale">—</b></div>
      <div class="card-row"><span>工具</span><b id="tools">—</b></div>
    </div>
    <div class="card">
      <small>本岛日额度</small>
      <div class="quotas" id="quotas"></div>
    </div>
    <div class="card">
      <small>今日收支</small>
      <div class="card-row"><span>收入</span><b class="up" id="earn">—</b></div>
      <div class="card-row"><span>支出</span><b class="down" id="spend">—</b></div>
      <div class="card-row"><span>卖货税</span><b id="tax">—</b></div>
    </div>
    <div class="actions">
      <button id="btnStart">启动</button>
      <button id="btnStop" class="ghost">暂停</button>
      <button id="btnOnce" class="ghost">巡视一次</button>
      <label class="chk"><input type="checkbox" id="dry" /> 演练（不提交）</label>
    </div>
    <div class="statusline" id="statusline"></div>
  </section>

  <!-- 市场预测 -->
  <section id="tab-market" class="tab" hidden>
    <div class="market-head">
      <div>
        <label>往后看几个岛日 <input type="number" id="mDays" value="12" min="1" max="24" /></label>
        <label>离峰值差几个点就卖 <input type="number" id="mMark" value="6" min="0" max="50" /></label>
      </div>
      <button id="mRefresh">刷新</button>
    </div>
    <div class="market-forecast" id="mForecast"></div>
    <div class="table-wrap">
      <table class="tbl" id="mTable">
        <thead>
          <tr><th>货物</th><th>数量</th><th>现价%</th><th>峰值%</th><th>几天后</th><th>卖线</th><th>建议</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- 设置 -->
  <section id="tab-settings" class="tab" hidden>
    <div class="settings" id="settings"></div>
    <div class="actions">
      <button id="cfgSave">保存设置</button>
      <button id="cfgReset" class="ghost">重新读取</button>
    </div>
    <div class="statusline" id="cfgStatus"></div>
  </section>

  <!-- 日志 -->
  <section id="tab-logs" class="tab" hidden>
    <div class="log-toolbar">
      <div class="seg">
        <button id="logModeNow" class="on">本次运行</button>
        <button id="logModeHist">历史记录</button>
      </div>
      <label class="chk"><input type="checkbox" id="logAuto" checked /> 自动刷新</label>
    </div>
    <div class="log-toolbar" id="histBar" hidden>
      <label class="chk">读取最近
        <select id="histDays">
          <option value="1">1 天</option>
          <option value="3" selected>3 天</option>
          <option value="7">7 天</option>
          <option value="14">14 天</option>
          <option value="30">30 天</option>
        </select>
      </label>
      <span class="muted" id="histInfo"></span>
      <button id="logClear" class="ghost">清屏</button>
    </div>
    <div class="logs" id="logs"></div>
  </section>

  <script src="popup.js" type="module"></script>
</body>
</html>
